<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Fool's Fortune Workshop</title>
  <script>
    // THE BOOT WATCH (a phone that will not open the game: Dovina's ask, 2026-10-24): from the first byte to the title, before any module
    // runs, so an error in the bundle's own evaluation or in the renderer's making is shown on screen, not a blank page. Each boot stage
    // (main.js's `mark`) is said under the loading line and kept as a breadcrumb in the tab's session storage and the page's local
    // storage (the Claude app may open the page again in a fresh view, where session storage is new): when a phone kills a page for its
    // memory and it is opened again, the box says where the last load stopped. A load that leaves the page (pagehide) forgets it. The
    // breadcrumb is a crash's note, not the game's state, and must be written before any module (the save among them) exists, so it is
    // kept here, never in the save. After `ready` errors are the game's own box's (main.js reportError).
    //   window.__bootWatch.stage(name)   .moment(name) (after boot)   .fail(error)   .build   .stages [[name, ms]]   (main.js's mark() calls stage; its start's catch, fail)
    (function () {
      var KEY = 'ff.bootWatch', t0 = Date.now(), W = window.__bootWatch = { stages: [], done: false }, box = null, line = null;
      var stores = [];
      try { window.sessionStorage.getItem(KEY); stores.push(window.sessionStorage); } catch (e) { /* none */ }
      try { window.localStorage.getItem(KEY); stores.push(window.localStorage); } catch (e) { /* none */ }
      var put = function (o) { for (var i = 0; i < stores.length; i++) { try { stores[i].setItem(KEY, JSON.stringify(o)); } catch (e) { /* full or refused */ } } };
      var last = null; for (var i = 0; i < stores.length && !last; i++) { try { last = JSON.parse(stores[i].getItem(KEY) || 'null'); } catch (e) { last = null; } } W.last = last; // (the last load's note, for the field report: debug/fieldreport.js)
      var show = function (text) {
        if (!document.body) { document.addEventListener('DOMContentLoaded', function () { show(text); }); return; }
        if (!box) { box = document.createElement('div'); box.id = 'bootwatch';
          box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:rgba(28,13,8,.94);color:#ffb27a;border:1px solid #ff7a4a;'
            + 'padding:8px 10px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:70%;overflow:auto;pointer-events:none';
          document.body.appendChild(box); }
        box.textContent += (box.textContent ? '\n' : '') + text;
      };
      var stageLine = function (name) {
        var l = document.getElementById('loading'); if (!l) return;
        if (!line) { line = document.createElement('div'); line.style.cssText = 'position:absolute;bottom:18%;left:0;right:0;text-align:center;font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;opacity:.6'; l.appendChild(line); }
        line.textContent = name + ' · ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s';
      };
      if (last && last.stage && last.stage !== 'left') {
        show('Last time, the game stopped ' + (last.stage === 'playing' ? 'while playing' : last.stage.indexOf('at:') === 0 ? 'at ' + last.stage.slice(3) : 'while starting, at "' + last.stage + '"') + ', '
          + (last.s || 0) + ' s in (' + (last.build || '?') + '). A phone does this when it runs out of memory; closing other apps and tabs may help.');
      }
      W.stage = function (name) {
        W.stages.push([name, Date.now() - t0]); stageLine(name);
        put({ stage: name === 'ready' || name === 'first frame' ? 'playing' : name, s: Math.round((Date.now() - t0) / 1000), build: W.build || '', ua: navigator.userAgent });
        if (name === 'ready') W.done = true;
      };
      W.moment = function (name) { put({ stage: 'at:' + name, s: Math.round((Date.now() - t0) / 1000), build: W.build || '', ua: navigator.userAgent }); }; // (after boot: the title, the seal's field, the world's first frame; the note a killed tab leaves)
      W.show = show; // (the game's own lines in the same box: the GPU's count when the graphics are taken back, render/contextloss.js)
      W.stage('html');
      var said = {};
      var report = function (what) { if (W.done) return; var msg = String(what); if (said[msg]) return; said[msg] = 1;
        show('The game could not start (' + (W.stages.length ? W.stages[W.stages.length - 1][0] : 'html') + ', ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s): ' + msg); };
      window.addEventListener('error', function (e) {
        var el = e && e.target; if (el && el !== window && el.tagName) { report('could not load ' + (el.src || el.href || el.tagName)); return; } // (a script or a stylesheet that failed to load: seen only by a capturing listener)
        var er = e && e.error; report((er && er.message) || (e && e.message) || 'an error');
        if (er && er.stack) show(String(er.stack).split('\n').slice(0, 4).join('\n'));
      }, true);
      W.fail = function (r) { report((r && r.message) || r || 'a promise failed'); if (r && r.stack) show(String(r.stack).split('\n').slice(0, 4).join('\n')); };
      window.addEventListener('unhandledrejection', function (e) { W.fail(e && e.reason); });
      window.addEventListener('webglcontextlost', function () { show('The 3D view stopped (' + (W.stages.length ? W.stages[W.stages.length - 1][0] : '') + ', ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s): the device took the graphics back. Reload the page to try again.'); }, true);
      window.addEventListener('pagehide', function () { put({ stage: 'left' }); });
    })();
  </script>
  <script>
    // THE PAGE'S TWO WAYS IN (the owner's iPhone, 2026-10-25: on iOS the host answers every supporting file 403 while this page runs;
    // Dovina's probe found the way): in the built page (vite.config.js `__ffEntry`, `__ffBuild`) the game's files are tried first, and
    // when they do not answer, the same build is read from the artifact's database, where scripts/pack.mjs put it as gzip in base64
    // chunks: each file unzipped into a blob, one import map from each script's bare name to its blob (laid before any module loads:
    // no module tag stands in the built page), the other files handed out by `__ffFile`, and the entry imported by its name. In the
    // dev server nothing here runs.
    //   window.__ffFile(name) -> the URL of a built asset by its file name (the files' folder, or its blob)
    (function () {
      var E = window.__ffEntry, B = window.__ffBuild, W = window.__bootWatch; if (!E) return;
      var base = new URL('./assets/', document.baseURI).href, blobs = {}, texts = {}, readText = null;
      window.__ffFile = function (n) { return blobs[n] || base + n; };
      // (a base64 asset's text by its file name (vite.config.js base64Assets): fetched from the files' folder, or read from the store when
      //  the files are refused; asked early by `eager` (the boot's own), handed to the module that awaits it and let go of here)
      var fetchText = function (n) { return readText ? readText(n) : fetch(base + n).then(function (r) { if (!r.ok) throw new Error('could not load ' + n + ' (' + r.status + ')'); return r.text(); }); };
      window.__ffText = function (n) { var p = texts[n] || fetchText(n); delete texts[n]; return p; };
      var eager = function () { (window.__ffEager || []).forEach(function (n) { if (!texts[n]) { texts[n] = fetchText(n); texts[n].catch(function () {}); } }); };
      var fail = function (e) { if (W && W.fail) W.fail(e); else throw e; };
      var bytes = function (b64) { var s = atob(b64), n = s.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = s.charCodeAt(i); return u; };
      var fromStore = async function (why) {
        if (W) W.stage('store');
        var use = window.claude && window.claude.use;
        var db = use ? await use('db') : null;
        if (!db) throw new Error('the game\'s files were refused here (' + why + ') and its store cannot be reached');
        var man = (await db.doc('pack/' + B + '.manifest').get()).data();
        if (!man) throw new Error('the game\'s files were refused here (' + why + ') and this build is not in its store');
        var imports = {}, names = Object.keys(man.files), next = 0;
        // (three files at a time, the biggest first, each file's strings let go once it is a blob: a phone's memory at its peak is what
        // a few files take, not all thirty: the owner's XR handed back a lost WebGL context right after the whole build was unpacked at once)
        names.sort(function (a, b) { return man.files[b].len - man.files[a].len; });
        var unzip = async function (name) {
          var f = man.files[name], parts = [];
          if (!f) throw new Error('the store holds no ' + name + ' for this build');
          for (var i = 0; i < f.n; i++) parts.push(db.doc('pack/' + B + '.' + f.id + '.' + i).get());
          var b64 = (await Promise.all(parts)).map(function (s) { return (s.data() || {}).b || ''; }).join(''); parts = null;
          var zipped = bytes(b64); b64 = null;
          var raw = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); zipped = null;
          if (raw.byteLength !== f.len) throw new Error('the store\'s copy of ' + name + ' is ' + raw.byteLength + ' bytes, not ' + f.len);
          return raw;
        };
        // (each file unpacked once a build and kept on the device in the Cache Storage, keyed by the build: the next load reads it from
        //  there, not 23 MB of base64 from the store again; another build's cache deleted. Where the cache is refused, the store each time.)
        var cache = null, hits = 0;
        try {
          if (window.caches) {
            cache = await caches.open('ff.pack.' + B);
            caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('ff.pack.') === 0 && k !== 'ff.pack.' + B) caches.delete(k); }); }).catch(function () {});
          }
        } catch (e) { cache = null; }
        var file = async function (name) {
          var f = man.files[name], key = base + name;
          if (cache && f) { try { var hit = await cache.match(key); if (hit) { var b = await hit.blob(); if (b.size === f.len) { hits++; return b; } } } catch (e) { /* unpacked again */ } }
          var blob = new Blob([await unzip(name)], { type: f.mime });
          if (cache) cache.put(key, new Response(blob, { headers: { 'content-type': f.mime } })).catch(function () {});
          return blob;
        };
        // (a base64 asset is read straight into its text when asked, never kept as a blob: the boot's are asked below, the rest when a
        //  dynamic import wants them, so the phone unpacks at boot only what the boot runs)
        readText = function (name) { return file(name).then(function (b) { return b.text(); }); };
        names = names.filter(function (n) { return !/\.txt$/.test(n); });
        var one = async function (name) {
          blobs[name] = URL.createObjectURL(await file(name));
          if (/\.js$/.test(name)) imports[name] = blobs[name];
        };
        var lane = async function () { while (next < names.length) await one(names[next++]); };
        await Promise.all([lane(), lane(), lane()]);
        var map = document.createElement('script'); map.type = 'importmap'; map.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(map);
        if (W) W.stage(hits ? 'store read (' + hits + ' of ' + names.length + ' from the device)' : 'store read');
        eager();
        await import(man.entry);
      };
      fetch(E, { method: 'HEAD', cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(String(r.status)); eager(); var s = document.createElement('script'); s.type = 'module'; s.src = E; document.head.appendChild(s); })
        .catch(function (why) { fromStore((why && why.message) || why).catch(fail); });
    })();
  </script>
  <style>
    :root { --ink: #fbe3cf; --accent: #ffb27a; --bg: #2a140d; --panel: rgba(42, 20, 13, 0.82); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: none; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    body.duel canvas { cursor: none; } /* (a puzzle duel: the god hand is the cursor, world/duel/duelsession.js) */
    #hitmarker { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%) rotate(45deg); opacity: 0; }
    #hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: var(--ink); left: 50%; top: 50%; transform: translate(-50%,-50%); }
    #hitmarker::before { width: 22px; height: 2px; } #hitmarker::after { width: 2px; height: 22px; }
    #hitmarker.kill::before, #hitmarker.kill::after { background: var(--accent); }
    #hitmarker.kill { width: 30px; height: 30px; }
    #hitmarker.kill::before { width: 30px; height: 3px; } #hitmarker.kill::after { width: 3px; height: 30px; }
    /* the turned glove's bob (the dialogue's "more": npc/dialogue.js) */
    @keyframes jbob { 50% { translate: 0 2px; } }
    #speed { position: absolute; right: 22px; bottom: calc(210px + var(--cine, 0vh)); text-align: right; font: 500 11px var(--f-ui); letter-spacing: .08em; opacity: .8; text-shadow: 1px 1px 0 rgba(8,3,1,.8); }
    #speed b { font: 16px var(--f-sys); color: #fff1dc; font-weight: normal; }
    #speed i { font-style: normal; color: var(--accent); }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(28,13,8,.55); z-index: 10; cursor: var(--jcur-pointer, pointer); }
    #overlay .card { background: var(--panel); border: 1px solid rgba(255,178,122,.35); padding: 22px 26px 0; max-width: 820px; width: calc(100% - 32px); box-sizing: border-box;
      max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,178,122,.5) transparent; }
    #overlay .card table { font-size: 12px; line-height: 1.3; }
    #overlay details { margin-top: 10px; font-size: 12px; }
    #overlay summary { cursor: var(--jcur-pointer, pointer); color: var(--accent); opacity: .9; line-height: 1.4; padding: 4px 0; }
    #overlay details table { margin-top: 6px; }
    #overlay .go { position: sticky; bottom: 0; margin: 12px -26px 0; padding: 14px 0 12px; background: linear-gradient(rgba(var(--jbot), 0), rgba(var(--jbot), .97) 35%); }
    #overlay .go .opt { cursor: var(--jcur-pointer, pointer); font: 600 17px var(--f-title); letter-spacing: .34em; color: #fff1dc; padding: 2px 6px 2px 12px; }
    #overlay { flex-direction: column; gap: 6px; background: radial-gradient(ellipse at 50% 38%, rgba(28,13,8,.3), rgba(10,4,2,.86)); }
    #overlay .card { cursor: default; max-height: calc(100% - 170px); }
    #overlay .logo { text-align: center; pointer-events: none; line-height: 1; }
    #overlay .logo small { font: italic 19px var(--f-lore); color: var(--ink); opacity: .85; }
    #overlay .logo b { display: block; font: 700 clamp(40px, 6.2vw, 76px)/1.05 var(--f-deco); padding: 0 .1em;
      background: linear-gradient(180deg, #fff7dc 0%, #ffd98a 44%, #b8742f 52%, #ffe2a6 72%, #fff3d0 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 0 #1c0d08) drop-shadow(0 0 16px rgba(255,178,122,.45)); }
    #overlay .logo span { display: block; font: 600 14px var(--f-title); letter-spacing: .5em; color: var(--accent); margin-top: 4px; text-shadow: 1px 1px 0 #1c0d08; }
    #overlay h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .24em; color: var(--accent); font-weight: 600; }
    #overlay p { margin: 0 0 16px; opacity: .8; }
    #overlay table { border-collapse: collapse; width: 100%; font-size: 13px; }
    #overlay td { padding: 3px 0; } #overlay td:first-child { color: var(--accent); width: 42%; }
    #overlay .go { margin-top: 18px; text-align: center; letter-spacing: .2em; animation: blink 1.4s infinite; }
    #overlay .warn { color: var(--accent); margin-top: 10px; font-size: 12px; display: none; }
    @keyframes blink { 50% { opacity: .45 } }
    #trialarrow { position: absolute; left: 0; top: 0; width: 0; height: 0; display: none; }
    #trialarrow::before { content: ''; position: absolute; left: -9px; top: -9px; width: 0; height: 0; }
    #trialarrow.edge::before { border-left: 18px solid #ffb27a; border-top: 9px solid transparent; border-bottom: 9px solid transparent; filter: drop-shadow(0 0 4px #ffb27a); }
    #trialarrow.over::before { left: -6px; top: -14px; border-top: 10px solid #fff1dc; border-left: 6px solid transparent; border-right: 6px solid transparent; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: .3em; z-index: 11; background: var(--bg); font-family: Georgia, serif; }
  </style>
</head>
<body>
  <div id="loading">FIRING THE KILN…</div>
  <div id="hud">
    <div id="hitmarker"></div>
    <div id="trialarrow"></div>
    <div id="speed"></div>
  </div>
  <div id="overlay">
    <div class="logo"><small>a sixth-generation sandbox</small><b>Fool's Fortune</b><span>The Clay Workshop</span></div>
    <div class="card">
      <div id="help"></div><!-- (the pages: src/feedback/help/pages.js, drawn by src/feedback/help/menu.js) -->
      <div class="go"><span class="opt">BEGIN</span></div>
      <div class="warn" id="lockwarn">Pointer lock unavailable here: look follows the cursor instead.</div>
    </div>
  </div>
  <script type="module">
    // THE LOADER: the game's code (main.js and all it imports, some 13 MB) fetched and run only once the page itself has loaded, so the
    // page has answered its host before the long parse begins (a phone's viewer gave up on the frame about 2 real s in, 2026-10-24).
    const go = () => import('./src/main.js');
    if (document.readyState === 'complete') setTimeout(go, 0); else addEventListener('load', () => setTimeout(go, 0), { once: true });
  </script>
</body>
</html>
