<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fool's Fortune Workshop</title>
  <style>
    :root { --ink: #fbe3cf; --accent: #ffb27a; --bg: #2a140d; --panel: rgba(42, 20, 13, 0.82); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: none; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    body.duel canvas { cursor: none; } /* (a puzzle duel: the god hand is the cursor, world/duel/duelsession.js) */
    #hitmarker { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%) rotate(45deg); opacity: 0; }
    #hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: var(--ink); left: 50%; top: 50%; transform: translate(-50%,-50%); }
    #hitmarker::before { width: 22px; height: 2px; } #hitmarker::after { width: 2px; height: 22px; }
    #hitmarker.kill::before, #hitmarker.kill::after { background: var(--accent); }
    #hitmarker.kill { width: 30px; height: 30px; }
    #hitmarker.kill::before { width: 30px; height: 3px; } #hitmarker.kill::after { width: 3px; height: 30px; }
    #charge { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; transform: translate(-50%,-50%) rotate(-90deg); opacity: 0; transition: opacity .1s; }
    #charge circle { fill: none; stroke-width: 2.5; }
    #charge .bg { stroke: rgba(28,13,8,.45); }
    #charge .arc { stroke: var(--accent); stroke-dasharray: 100; stroke-dashoffset: 100; }
    #charge.full .arc { stroke: #fff1dc; animation: pulse .25s infinite alternate; }
    @keyframes pulse { to { stroke-width: 4; } }
    /* the turned glove's bob (the dialogue's "more": npc/dialogue.js) */
    @keyframes jbob { 50% { translate: 0 2px; } }
    #reloadbar { position: absolute; left: 50%; top: calc(50% + 40px); width: 80px; height: 3px; transform: translateX(-50%); background: rgba(28,13,8,.6); opacity: 0; }
    #reloadbar i { display: block; height: 100%; width: 0; background: var(--accent); }
    #speed { position: absolute; right: 22px; bottom: calc(210px + var(--cine, 0vh)); text-align: right; font: 500 11px var(--f-ui); letter-spacing: .08em; opacity: .8; text-shadow: 1px 1px 0 rgba(8,3,1,.8); }
    #speed b { font: 16px var(--f-sys); color: #fff1dc; font-weight: normal; }
    #speed i { font-style: normal; color: var(--accent); }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(28,13,8,.55); z-index: 10; cursor: var(--jcur-pointer, pointer); }
    #overlay .card { background: var(--panel); border: 1px solid rgba(255,178,122,.35); padding: 22px 26px 0; max-width: 820px; width: calc(100% - 32px); box-sizing: border-box;
      max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,178,122,.5) transparent; }
    #overlay .card table { font-size: 12px; line-height: 1.3; }
    #overlay details { margin-top: 10px; font-size: 12px; }
    #overlay summary { cursor: var(--jcur-pointer, pointer); color: var(--accent); opacity: .9; line-height: 1.4; padding: 4px 0; }
    #overlay details table { margin-top: 6px; }
    #overlay .go { position: sticky; bottom: 0; margin: 12px -26px 0; padding: 14px 0 12px; background: linear-gradient(rgba(var(--jbot), 0), rgba(var(--jbot), .97) 35%); }
    #overlay .go .opt { cursor: var(--jcur-pointer, pointer); font: 600 17px var(--f-title); letter-spacing: .34em; color: #fff1dc; padding: 2px 6px 2px 12px; }
    #overlay { flex-direction: column; gap: 6px; background: radial-gradient(ellipse at 50% 38%, rgba(28,13,8,.3), rgba(10,4,2,.86)); }
    #overlay .card { cursor: default; max-height: calc(100% - 170px); }
    #overlay .logo { text-align: center; pointer-events: none; line-height: 1; }
    #overlay .logo small { font: italic 19px var(--f-lore); color: var(--ink); opacity: .85; }
    #overlay .logo b { display: block; font: 700 clamp(40px, 6.2vw, 76px)/1.05 var(--f-deco); padding: 0 .1em;
      background: linear-gradient(180deg, #fff7dc 0%, #ffd98a 44%, #b8742f 52%, #ffe2a6 72%, #fff3d0 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 0 #1c0d08) drop-shadow(0 0 16px rgba(255,178,122,.45)); }
    #overlay .logo span { display: block; font: 600 14px var(--f-title); letter-spacing: .5em; color: var(--accent); margin-top: 4px; text-shadow: 1px 1px 0 #1c0d08; }
    #overlay h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .24em; color: var(--accent); font-weight: 600; }
    #overlay p { margin: 0 0 16px; opacity: .8; }
    #overlay table { border-collapse: collapse; width: 100%; font-size: 13px; }
    #overlay td { padding: 3px 0; } #overlay td:first-child { color: var(--accent); width: 42%; }
    #overlay .go { margin-top: 18px; text-align: center; letter-spacing: .2em; animation: blink 1.4s infinite; }
    #overlay .warn { color: var(--accent); margin-top: 10px; font-size: 12px; display: none; }
    @keyframes blink { 50% { opacity: .45 } }
    #locks { position: absolute; inset: 0; overflow: hidden; }
    .lock { position: absolute; left: 0; top: 0; width: 0; height: 0; --s: 60px; --ra: 45deg; --rb: 45deg; }
    .lock i { position: absolute; left: calc(var(--s) / -2); top: calc(var(--s) / -2); width: var(--s); height: var(--s); box-sizing: border-box;
      border: 2px solid rgba(255,178,122,.9); transform: rotate(var(--ra)); box-shadow: 0 0 6px rgba(255,178,122,.45); }
    .lock i.b { transform: rotate(var(--rb)); border: 1px solid rgba(251,227,207,.75); box-shadow: none; }
    .lock.locked i { border-color: #fff1dc; box-shadow: 0 0 10px #ffb27a, inset 0 0 6px rgba(255,178,122,.6); }
    .lock.locked i.b { transform: rotate(var(--rb)) scale(.55); border: 2px solid #ffb27a; background: rgba(255,178,122,.18); }
    .lock span { position: absolute; left: calc(var(--s) / 2 + 3px); top: calc(var(--s) / -2 - 6px); font-size: 11px; color: #fff1dc; text-shadow: 0 1px 0 #1c0d08; }
    .lock.burst { animation: lburst .25s ease-out forwards; }
    @keyframes lburst { to { opacity: 0; scale: 1.9; } }
    #trial { position: absolute; left: 50%; top: calc(48px + var(--cine, 0vh)); transform: translateX(-50%); text-align: center; display: none; }
    #trial .row { display: flex; gap: 14px; align-items: baseline; justify-content: center; }
    #trial .time { font: 32px var(--f-sys); color: #fff1dc; letter-spacing: .06em; text-shadow: 0 2px 0 #1c0d08; font-variant-numeric: tabular-nums; }
    #trial .count { font: 16px var(--f-sys); color: var(--accent); }
    #trial .medals { font-size: 10px; letter-spacing: .12em; opacity: .7; margin-top: 2px; }
    #trialbig { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font: 700 64px var(--f-deco); color: #fff1dc; text-align: center;
      letter-spacing: .08em; text-shadow: 0 3px 0 #1c0d08, 0 0 24px rgba(255,178,122,.6); display: none; }
    #trialbig small { display: block; font-size: 16px; letter-spacing: .2em; color: var(--accent); margin-top: 8px; line-height: 1.6; }
    #trialarrow { position: absolute; left: 0; top: 0; width: 0; height: 0; display: none; }
    #trialarrow::before { content: ''; position: absolute; left: -9px; top: -9px; width: 0; height: 0; }
    #trialarrow.edge::before { border-left: 18px solid #ffb27a; border-top: 9px solid transparent; border-bottom: 9px solid transparent; filter: drop-shadow(0 0 4px #ffb27a); }
    #trialarrow.over::before { left: -6px; top: -14px; border-top: 10px solid #fff1dc; border-left: 6px solid transparent; border-right: 6px solid transparent; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: .3em; z-index: 11; background: var(--bg); font-family: Georgia, serif; }
  </style>
</head>
<body>
  <div id="loading">FIRING THE KILN…</div>
  <div id="hud">
    <div id="hitmarker"></div>
    <svg id="charge" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="15.9" pathLength="100"/><circle class="arc" cx="20" cy="20" r="15.9" pathLength="100"/></svg>
    <div id="reloadbar"><i></i></div>
    <div id="locks"></div>
    <div id="trial"><div class="row"><span class="time">0:00.0</span><span class="count">0/12</span></div><div class="medals"></div></div>
    <div id="trialbig"></div>
    <div id="trialarrow"></div>
    <div id="speed"></div>
  </div>
  <div id="overlay">
    <div class="logo"><small>a sixth-generation sandbox</small><b>Fool's Fortune</b><span>The Clay Workshop</span></div>
    <div class="card">
      <div id="help"></div><!-- (the pages: src/feedback/help/pages.js, drawn by src/feedback/help/menu.js) -->
      <div class="go"><span class="opt">BEGIN</span></div>
      <div class="warn" id="lockwarn">Pointer lock unavailable here: look follows the cursor instead.</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
